# Build the browser app and publish it to GitHub Pages.
#
# The assets are in the repo under `assets/` — the wrench checkpoint, its brace graph, the clip and
# the robot model — so the build is a checkout away and there is no fetch step to keep in sync.
#
# Pages rather than a third-party host because the repo is public: the site serves the same files a
# clone already gives you, so gating it would protect nothing, and this needs no account, no
# secrets and no CLI.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # mjswan's Builder shells out to Vite. Given a system Node it uses it rather than
      # provisioning its own, which is both faster and avoids its npm-without-PATH bug.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          # CPU torch first, explicitly: the default index resolves the CUDA build, which is
          # gigabytes of wheels this job never runs a kernel on.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Test simulator contracts
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Build
        run: |
          # A project page is served from /<repo>/, and Vite bakes asset URLs at build time, so the
          # base path has to be set here or the deployed page loads nothing.
          #
          # One policy: the wrench student, which exerts and compensates force and moment and
          # carries the ramp, so the page needs no picker.
          python -m robogym_online.build_app \
            --wrench-only --exert --half-weights \
            --wrench-onnx-dir assets/compiled_models_wrench \
            --wrench-brace assets/brace_wrench.onnx \
            --base-path "/${GITHUB_REPOSITORY#*/}/" \
            --output dist

      - name: Check browser contact against training equations
        run: |
          export NODE_PATH="$(python -c 'import mjswan; from pathlib import Path; print(Path(mjswan.__file__).parent / "template/node_modules")')"
          node tests/contact_parity.cjs
          node tests/robot_slots.cjs
          node tests/stability_burst.cjs
          node tests/fall_guard.cjs
          node tests/respawn_surface.cjs
          node tests/reference_inputs.cjs
          node tests/steering_lock.cjs
          node tests/exertion_envelope.cjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Publish only from main, so a PR still gets its build checked without moving the live site.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
