# Build the browser app and publish it to GitHub Pages.
#
# The assets are in the repo under `assets/` — checkpoint, clip, robot model and the pre-exported
# brace graph — so the build is a checkout away and there is no fetch step to keep in sync.
#
# Pages rather than a third-party host because the repo is public: the site serves the same files a
# clone already gives you, so gating it would protect nothing, and this needs no account, no
# secrets and no CLI.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # mjswan's Builder shells out to Vite. Given a system Node it uses it rather than
      # provisioning its own, which is both faster and avoids its npm-without-PATH bug.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          # CPU torch first, explicitly: the default index resolves the CUDA build, which is
          # gigabytes of wheels this job never runs a kernel on.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Build
        run: |
          # A project page is served from /<repo>/, and Vite bakes asset URLs at build time, so the
          # base path has to be set here or the deployed page loads nothing.
          python -m robogym_online.build_app \
            --exert \
            --brace assets/brace.onnx \
            --base-path "/${GITHUB_REPOSITORY#*/}/" \
            --output dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Publish only from main, so a PR still gets its build checked without moving the live site.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
