[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robogym-online"
version = "0.1.0"
description = "Whole-body humanoid force control in the browser: MuJoCo-WASM, ONNX policies, no server"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }

dependencies = [
  # The browser engine and its Builder, pinned to a fork carrying the additions this app needs
  # (windowed reference fields, structured policy inputs, the pose ghost, the hand spring contact,
  # the ORT-Web session fallback); each is upstream-shaped and tracked for a PR back.
  #
  # The `examples` extra is not optional for us: it brings mjlab, whose entity API the observation
  # terms are written against, plus torch and onnxruntime.
  #
  # `mujoco` and `onnx` are deliberately NOT pinned here. mjswan pins them, and it has to: the
  # Python-side MuJoCo has to match the WASM engine its build ships. Restating a floor here only
  # produces a resolver conflict with the version that actually works.
  "mjswan[examples] @ git+https://github.com/multiplylabs/mjswan@robogym",
  "numpy>=1.26",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "black>=24"]

# The mjswan pin is a git URL, which hatchling refuses to treat as a dependency unless direct
# references are allowed explicitly.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/robogym_online"]

[tool.black]
line-length = 110

[tool.ruff]
line-length = 110
