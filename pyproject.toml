[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robogym-online"
version = "0.1.0"
description = "Whole-body humanoid force control in the browser: MuJoCo-WASM, ONNX policies, no server"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }

dependencies = [
  # The browser engine and its Builder, pinned to a fork carrying the additions this app needs
  # (windowed reference fields, structured policy inputs, the pose ghost, the hand spring contact,
  # the ORT-Web session fallback); each is upstream-shaped and tracked for a PR back.
  #
  # NOT `mjswan[examples]`: that extra also carries myosuite, which requires mujoco < 3.7 and can
  # therefore never coexist with mjlab's ~= 3.10 -- the extra is unsatisfiable as a whole. We need
  # exactly one thing out of it, so mjlab is taken directly, at the version mjswan pins.
  "mjswan @ git+https://github.com/multiplylabs/mjswan@robogym",
  # mjlab's entity API is what the observation terms are written against; it also carries the
  # mujoco floor (~= 3.10), so `mujoco` is left unpinned here on purpose.
  "mjlab==1.5.3",
  "onnxruntime>=1.18",
  "torch>=2.4",
  "numpy>=1.26",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "black>=24"]

# The mjswan pin is a git URL, which hatchling refuses to treat as a dependency unless direct
# references are allowed explicitly.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/robogym_online"]

[tool.black]
line-length = 110

[tool.ruff]
line-length = 110
